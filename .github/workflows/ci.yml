name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      audit-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: audit
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRATTE_AUDIT_TEST_DSN: postgresql://audit:audit@localhost:5432/audit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest
      - name: Replay synthetic case from empty database to BI snapshot
        env:
          TRATTE_DEMO_DATABASE_URL: postgresql+psycopg://audit:audit@localhost:5432/public_demo
        run: |
          python -c "import psycopg; c = psycopg.connect('postgresql://audit:audit@localhost:5432/audit', autocommit=True); c.execute('CREATE DATABASE public_demo'); c.close()"
          python -m analytics.demo.postgres

  promote:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Mark revision as ready to deploy
        run: git push origin HEAD:refs/heads/deploy
